components:
  securitySchemes:
    bearerBoardKey:
      type: http
      scheme: bearer
      description: "A board API key (`pcp_board_…`): acts as the person who approved it, with that person's company memberships and nothing narrower — board keys have no scopes. Expires 30 days after it is minted. Minted by the CLI sign-in flow; see the API keys page. (server/src/middleware/auth.ts, `board_key`.)"
    bearerAgentKey:
      type: http
      scheme: bearer
      description: "An agent API key (`pcp_…`): acts as one agent in one company. Also accepted as the `x-agent-key` header when no Authorization header is sent. A run-scoped agent JWT issued to a local adapter is accepted the same way. (server/src/middleware/auth.ts, `agent_key` and `agent_jwt`.)"
    session:
      type: apiKey
      in: cookie
      name: paperclip-default.session_token
      description: The web app's signed-in session cookie. The name is per instance (`<prefix>.session_token`, `__Secure-` prefixed over https); browsers send it automatically. Meant for the web app, not for integrations — use a board key. (server/src/middleware/auth.ts, `session`.)
    assistantOAuth:
      type: oauth2
      description: "OAuth 2.1 with PKCE, for an assistant acting for one person in one company (`pcpa_…` access tokens). Discovery: `/.well-known/oauth-protected-resource` and `/.well-known/oauth-authorization-server`. A grant reaches only the assistant routes its scopes allow; anything else is 403. (server/src/middleware/auth.ts, `assistant_grant`.)"
      flows:
        authorizationCode:
          authorizationUrl: /oauth/authorize
          tokenUrl: /oauth/token
          refreshUrl: /oauth/token
          scopes:
            agentdash:read: Read the company's work.
            agentdash:work: Create and move work, wake agents.
            agentdash:decide: Resolve approvals and hire. Opt-in at consent; never granted by default.
    bearerBridgeEndpoint:
      type: http
      scheme: bearer
      description: An enrolled machine's endpoint token. Resolved only on the bridge's own routes; on any other path it is treated as no credential at all. (server/src/middleware/auth.ts, `bridge_endpoint`.)
  responses:
    BadRequest:
      description: The request is malformed. `Invalid identifier` when a path or query id is not a UUID (server/src/middleware/error-handler.ts); `Validation error` with `details` when the body fails its schema.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: No credential, or the credential did not resolve to an actor.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: "The caller is authenticated but may not do this: a missing permission, a read-only principal, or a credential that cannot reach this route (an assistant grant without the required scope answers `insufficient_scope`)."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: "No such resource, **or one the caller is not allowed to see**. Visibility answers 404, never 403: a 403 on a guessed id would confirm the thing exists (server/src/routes/visibility.ts)."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The resource is not in a state that allows this (for example, an issue already checked out by another agent).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unprocessable:
      description: The body is well-formed but asks for something the server will not do.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: "Rate limited (server/src/middleware/rate-limit.ts). Under /api, state-changing requests are limited per actor (or per IP when unauthenticated): 200 per 15 minutes by default, lower on auth, billing, invite and trial routes. Authenticated reads are not counted. The response carries `Retry-After` and the draft-7 `RateLimit` headers. Instances may configure other limits."
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RateLimitError"
  schemas:
    ActivityEvent:
      type: object
      properties:
        id:
          type: string
        companyId:
          type: string
        actorType:
          type: string
          enum:
            - agent
            - user
            - system
            - plugin
        actorId:
          type: string
        action:
          type: string
        entityType:
          type: string
        entityId:
          type: string
        agentId:
          type:
            - string
            - "null"
        runId:
          type:
            - string
            - "null"
        details:
          anyOf:
            - type: object
              additionalProperties: {}
            - type: "null"
        origin:
          type:
            - string
            - "null"
          enum:
            - server
            - manual
            - null
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - companyId
        - actorType
        - actorId
        - action
        - entityType
        - entityId
        - agentId
        - runId
        - details
        - createdAt
